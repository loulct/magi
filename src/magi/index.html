<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM ChatBox</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e1e2e;
      color: #cdd6f4;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 80vh;
      background: #252538;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .chat-header {
      background: #11111b;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2em;
      border-bottom: 1px solid #45475a;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 8px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user-msg {
      background: #89b4fa;
      color: #11111b;
      align-self: flex-end;
    }

    .ai-msg {
      background: #45475a;
      color: #cdd6f4;
      align-self: flex-start;
    }

    .input-area {
      display: flex;
      padding: 15px;
      background: #11111b;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #313244;
      color: #cdd6f4;
      font-size: 1em;
    }

    input:focus {
      outline: 2px solid #89b4fa;
    }

    button {
      background: #89b4fa;
      color: #11111b;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #b4befe;
    }

    button:disabled {
      background: #585b70;
      cursor: not-allowed;
    }

    .switch-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #89b4fa;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
    }

    .switch-btn:disabled {
      background: #585b70;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="chat-container">
    <div class="chat-header">LLM ChatBox</div>
    <div class="chat-box" id="chatBox">
      <div class="message ai-msg">Awaiting input...</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="..." autofocus>
      <button id="sendBtn" onclick="sendMessage()">Send</button>
      <button class="switch-btn" id="switchBtn">RAG</button>
    </div>
  </div>

  <script>
    let conversationHistory = [];
    let rag = false;

    function toggleRAG() {
      rag = !rag
      console.log(rag)
      try {
        const response = fetch("http://127.0.0.1:8080/toggle_rag", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            value: rag
          })
        });
      } catch (error) {
        console.error(error);
      }
    }

    document.getElementById('switchBtn').addEventListener('click', toggleRAG);

    async function sendMessage() {
      const inputField = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");
      const sendBtn = document.getElementById("sendBtn");
      const text = inputField.value.trim();

      if (!text) return;

      appendMessage(text, 'user-msg');
      inputField.value = "";
      conversationHistory.push({role: "user", content: text});

      inputField.disabled = true;
      sendBtn.disabled = true;

      const aiMessageDiv = appendMessage("", 'ai-msg');
      let fullAiResponse = "";

      try {
        const response = await fetch("http://127.0.0.1:8080/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            messages: conversationHistory
          })
        });

        if (!response.ok) throw new Error("Local Server Error");

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        while (true) {
          const {value, done} = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split("\n");

          for (const line of lines) {
            if (line.startsWith("data: ")) {
              try {
                const jsonData = JSON.parse(line.slice(6));
                const token = jsonData.token;

                fullAiResponse += token;
                aiMessageDiv.innerText = fullAiResponse;
                chatBox.scrollTop = chatBox.scrollHeight;
              } catch (e) {
              }
            }
          }
        }

        conversationHistory.push({role: "assistant", content: fullAiResponse});


      } catch (error) {
        console.error(error);
        aiMessageDiv.innerText = "Error : Can't reach LLM model.";
      } finally {
        inputField.disabled = false;
        sendBtn.disabled = false;
        inputField.focus();
        // chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(text, className) {
      const chatBox = document.getElementById("chatBox");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${className}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    document.getElementById("userInput").addEventListener("keypress", function (e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>

</body>

</html>
