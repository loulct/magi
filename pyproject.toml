[project]
name = "magi"
version = "0.1.0"
description = "LLM Chatbox"
readme = "README.md"
authors = [
    { name = "loulct", email = "lecart-louis@orange.fr" }
]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "llama-cpp-python>=0.3.36",
]

[project.scripts]
magi = "magi:main"

[[tool.uv.index]]
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
